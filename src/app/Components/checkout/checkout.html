<div class="checkout-overlay" *ngIf="isOpen()" (click)="onClose.emit()">
  <div class="checkout-container" (click)="$event.stopPropagation()">

    <div class="checkout-header">
      <h2>Checkout</h2>
      <button class="close-btn" (click)="onClose.emit()">×</button>
    </div>

    <div class="checkout-body">

      <!-- Success Message -->
      <div *ngIf="paymentService.paymentSuccess()" class="success-message">
        <h3>Payment Successful!</h3>
        <p>Thank you for your purchase. Your order has been confirmed.</p>
        <button class="continue-btn" (click)="handleSuccess()">
          Continue Shopping
        </button>
      </div>

      <!-- Payment Form -->
      <form
        *ngIf="!paymentService.paymentSuccess()"
        #paymentForm="ngForm"
        (ngSubmit)="processPayment()"
      >

        <div class="total-amount">
          <h3>Total Amount: R{{ totalAmount().toFixed(2) }}</h3>
        </div>

        <div class="form-group">
          <label for="cardholderName">Cardholder Name</label>
          <input
            type="text"
            id="cardholderName"
            name="cardholderName"
            [(ngModel)]="paymentDetails.cardholderName"
            required
            placeholder="John Doe"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input
            type="text"
            id="cardNumber"
            name="cardNumber"
            [(ngModel)]="paymentDetails.cardNumber"
            required
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            (input)="formatCardNumber($event.target.value)"
            class="form-control"
          />
        </div>

        <div class="form-row">

          <div class="form-group">
            <label for="expiryDate">Expiry Date (MM/YY)</label>
            <input
              type="text"
              id="expiryDate"
              name="expiryDate"
              [(ngModel)]="paymentDetails.expiryDate"
              required
              placeholder="MM/YY"
              maxlength="5"
              (input)="formatExpiry($event.target.value)"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="cvv">CVV</label>
            <input
              type="text"
              id="cvv"
              name="cvv"
              [(ngModel)]="paymentDetails.cvv"
              required
              placeholder="123"
              maxlength="4"
              class="form-control"
            />
          </div>

        </div>

        <!-- Error Message -->
        <div *ngIf="paymentService.paymentError()" class="error-message">
          {{ paymentService.paymentError() }}
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="pay-btn"
          [disabled]="paymentForm.invalid || paymentService.isProcessing()"
        >
          <span *ngIf="!paymentService.isProcessing()">
            Pay R{{ totalAmount().toFixed(2) }}
          </span>

          <span *ngIf="paymentService.isProcessing()" class="spinner">
            Processing...
          </span>
        </button>

      </form>

    </div>
  </div>
</div>

<div class="forgot-password-container">

  <h2>Reset Password</h2>

  <p>
    Enter your email address and we will send you a password reset link.
  </p>

  <form (ngSubmit)="resetPassword()">

    <input
      type="email"
      placeholder="Enter your email"
      [(ngModel)]="email"
      name="email"
      required
    />

    <button type="submit">
      Send Reset Link
    </button>

  </form>

</div>

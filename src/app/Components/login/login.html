<div class="login-overlay-wrapper">
  <div class="overlay-backdrop" (click)="close()"></div>
  <div class="login-container">
    <button class="close-modal-btn" (click)="close()">×</button>
    
    <div class="welcome-banner">
        <div class="brand-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 10L12 6" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M20 10L20 6" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <rect x="8" y="10" width="16" height="14" rx="2" stroke="white" stroke-width="1.8" fill="none"/>
                <path d="M16 16L16 22" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="20" r="1.2" fill="white"/>
                <circle cx="20" cy="20" r="1.2" fill="white"/>
                <path d="M21 24L23 28" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M11 24L9 28" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
        </div>
        <p style="font-size: 0.85rem; color: #5b7342; margin-top: 12px; font-weight: 470;">Welcome to</p>
        <h1>HomePlug</h1>
        <div class="leaf-accent"></div>
        <p style="font-size: 0.85rem; color: #5b7342; margin-top: 12px; font-weight: 470;">Power your home with ease</p>
    </div>

  <form (ngSubmit)="login()">
    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required
    />
    <div class="error-text" *ngIf="emailError">{{ emailError }}</div>

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
    />
    <div class="error-text" *ngIf="passwordError">{{ passwordError }}</div>

    <button type="submit">
      Login
    </button>
    <div class="error-text" *ngIf="generalError">{{ generalError }}</div>
  </form>

  <p>
    <a href="#" (click)="$event.preventDefault()">
        Forgot Password? 
    </a>
  </p>

  <div class="signup-option">
    <span style="color: #53663e;">Don't have an account?</span>
    <a href="#" (click)="$event.preventDefault(); close()" class="signup-link" style="text-decoration: none;">Sign up now →</a>
  </div>
</div>
</div>

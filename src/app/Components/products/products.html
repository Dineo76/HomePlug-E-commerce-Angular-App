
@for (product of productService.productSig(); track product.id) {
    <div class="card">
      <img [src]="product.thumbnail" [alt]="product.title" />
      <div class="card-body">
        <h3>{{ product.title }}</h3>
        <p class="price">R{{ product.price }}</p>
        <div>
            <p>rating: {{product.rating}}</p>
        </div>
        
        
      </div>
    </div>
  }

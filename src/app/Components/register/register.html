<div class="register-container">

  <h2>Create Account</h2>

  <form (ngSubmit)="register()">

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
    />

    <button type="submit">
      Register
    </button>

  </form>

</div>

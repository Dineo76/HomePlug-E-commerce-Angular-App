<div *ngIf="toastMessage" class="toast">
  {{ toastMessage }}
</div>

<nav class="header">

  <div class="logo">
    <img src="https://chatgpt.com/s/m_6a1d406a80fc8191935638f9595ec9bf" width="35">
    <span>HomePlug</span>
  </div>

  <div class="search">
    <input
      type="text"
      placeholder="Search products..."
    />
  </div>

  <div class="nav-links">
    <a routerLink="/">Home</a>
    <a href="#">Products</a>
    <a href="#">About Us</a>
    <a href="#">FAQS</a>
  </div>

  <div class="icons">
    <div class="icon">
      <span><p>🛍️ Cart</p></span>
    </div>

    <div class="icon">
      <span><p>❤️ Wishlist</p></span>
    </div>

    <div class="icon profile" (click)="openProfileModal()">         
      <div class="avatar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <p>Profile</p>
    </div>

  </div>

</nav>

<app-profile-modal 
  *ngIf="showProfileModal"
  [isLoggedIn]="isLoggedIn"
  [userEmail]="userEmail"
  [userId]="userId"
  [userFirstName]="userFirstName"
  [userLastName]="userLastName"
  (closeModal)="closeProfileModal()"
  (logoutEvent)="logout()"
  (showLogin)="onShowLogin()"
  (showRegister)="onShowRegister()">
</app-profile-modal>

<app-login 
  *ngIf="showLoginModal"
  (closeModal)="closeLoginModal()"
  (successLogin)="handleLoginSuccess()">
</app-login>

<app-register 
  *ngIf="showRegisterModal"
  (closeModal)="closeRegisterModal()"
  (successRegister)="handleRegisterSuccess()">
</app-register>

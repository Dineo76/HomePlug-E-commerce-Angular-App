<nav class="header">

  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="#7d9b76">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span>HomePlug</span>
  </div>

  <div class="search">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchTerm"
      (input)="searchProducts()"
    />

  </div>

  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active-link">Home</a>
    <a routerLink="/products" routerLinkActive="active-link">Products</a>
    <a href="#">About Us</a>
    <a routerLink="faqs">FAQS</a>
  </div>

  <div class="icons">

    <div class="icon" (click)="productService.openCart()">
      <span>
        <p>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="18"
               height="18"
               viewBox="0 0 24 24"
               fill="#ffffff"
               style="vertical-align: middle; margin-right: 5px;">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10
                     0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9
                     2-2-.9-2-2-2zM7.16 14h9.45c.75 0 1.41-.41
                     1.75-1.03L22 6H6.21l-.94-2H2v2h2l3.6
                     7.59-1.35 2.44C5.52 16.37 6.48 18 8
                     18h12v-2H8l1.16-2z"/>
          </svg>
          Cart ({{ productService.cartTotal() }})
        </p>
      </span>
    </div>

    <div class="icon" (click)="productService.openWishlist()">
      <span>
        <p>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="18"
               height="18"
               viewBox="0 0 24 24"
               fill="#ffffff"
               style="vertical-align: middle; margin-right: 5px;">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2
                     8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81
                     4.5 2.09C13.09 3.81 14.76 3 16.5
                     3 19.58 3 22 5.42 22 8.5c0 3.78-3.4
                     6.86-8.55 11.54L12 21.35z"/>
          </svg>
          Wishlist ({{ productService.wishlist().length }})
        </p>
      </span>
    </div>

  </div>

  <div class="icon profile">
    <div class="avatar" (click)="openProfileModal()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>
    <p (click)="openProfileModal()">Profile</p>
  </div>

</nav>

<app-profile-modal
  *ngIf="showProfileModal"
  [isLoggedIn]="isLoggedIn"
  [userEmail]="userEmail"
  [userId]="userId"
  [userFirstName]="userFirstName"
  [userLastName]="userLastName"
  (closeModal)="closeProfileModal()"
  (logoutEvent)="logout()"
  (showLogin)="onShowLogin()"
  (showRegister)="onShowRegister()">
</app-profile-modal>
